        <div class="field"><label for="imStatus">Trạng thái</label>
          <select class="input" id="imStatus"><option value="ongoing">Đang ra</option><option value="completed">Hoàn thành</option></select>
        </div>
        <div class="field"><label for="imCover">Ảnh bìa (tùy chọn)</label><input class="input" id="imCover" type="file" accept="image/*"></div>
      </div>
    </div>
    <div class="section-head" style="margin-top:22px"><h2>Xem trước chương đã tách</h2><span class="muted" id="prevCount" style="font-size:13px">chưa phân tích</span></div>
    <div class="preview-list" id="previewList"><div class="item muted">Chọn file và bấm “Phân tích chương” để xem kết quả tách.</div></div>
    <div class="chapter-tools" style="margin-top:14px">
      <button class="btn btn-primary" id="saveImport" disabled>Lưu vào hệ thống</button>
      <span class="muted" style="font-size:13px">Nội dung trước đầu chương đầu tiên sẽ thành chương “Lời mở đầu”.</span>
    </div>`;

  let coverData = "";
  const fileInput = $("#txtFile"), parseBtn = $("#parseBtn"), saveBtn = $("#saveImport");

  fileInput.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      txtState.raw = String(reader.result || "").replace(/\r\n?/g, "\n");
      txtState.fileName = f.name;
      txtState.chapters = [];
      parseBtn.disabled = false;
      saveBtn.disabled = true;
      $("#fileInfo").textContent = `Đã nạp “${f.name}” — ${fmtBytes(f.size)}, ${txtState.raw.split("\n").length.toLocaleString("vi-VN")} dòng.`;
      if (!$("#imTitle").value) $("#imTitle").value = f.name.replace(/\.txt$/i, "").replace(/[_-]+/g, " ").trim();
      $("#previewList").innerHTML = '<div class="item muted">Bấm “Phân tích chương” để tách nội dung.</div>';
    };
    reader.onerror = () => toast("Không đọc được file này");
    reader.readAsText(f, "UTF-8");
  };

  $("#imCover").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { coverData = await compressImage(f); toast("Đã nạp ảnh bìa"); }
    catch (err) { console.error(err); toast("Không đọc được ảnh này"); }
  };

  $("#resetPattern").onclick = () => { $("#txtPattern").value = DEFAULT_PATTERN; };

  parseBtn.onclick = async () => {
    let re;
    try { re = new RegExp($("#txtPattern").value.trim(), "i"); }
    catch (err) { toast("Biểu thức regex không hợp lệ"); return; }
    parseBtn.disabled = true;
    const chapters = await parseTxtToChapters(txtState.raw, re, (pct) => { $("#parseBar").style.width = pct + "%"; });
    parseBtn.disabled = false;
    txtState.chapters = chapters;
    $("#prevCount").textContent = chapters.length + " chương tách được";
    $("#previewList").innerHTML = chapters.length ? chapters.slice(0, 400).map((c) => `
      <div class="item">
        <div class="pt">Chương ${c.order} — ${esc(c.title || "Không tên")}</div>
        <div class="pp">${esc((c.content || "").slice(0, 160))}</div>
      </div>`).join("") + (chapters.length > 400 ? `<div class="item muted">… và ${chapters.length - 400} chương nữa</div>` : "")
      : '<div class="item muted">Không tách được chương nào. Thử sửa biểu thức regex cho khớp định dạng file.</div>';
    saveBtn.disabled = chapters.length === 0;
    toast(chapters.length ? `Đã tách ${chapters.length} chương` : "Không tìm thấy đầu chương nào");
  };

  saveBtn.onclick = async () => {
    const title = $("#imTitle").value.trim();
    if (!title) { toast("Nhập tên truyện trước khi lưu"); return; }
    if (!txtState.chapters.length) { toast("Chưa có chương nào để lưu"); return; }
    saveBtn.disabled = true;
    const now = Date.now();
    const story = {
      id: uid("st"), title,
      author: $("#imAuthor").value.trim(),
      description: "Nhập từ file " + (txtState.fileName || "văn bản") + ".",
      genres: $("#imGenres").value.split(",").map((x) => x.trim()).filter(Boolean),
      status: $("#imStatus").value,
      cover: coverData, featured: false,
      createdAt: now, updatedAt: now
    };
    await DB.put("stories", story);

    // Ghi theo lô 200 chương / transaction để không chặn giao diện quá lâu
    const batch = 200;
    for (let i = 0; i < txtState.chapters.length; i += batch) {
      const slice = txtState.chapters.slice(i, i + batch).map((c) => ({
        id: uid("ch"), storyId: story.id, order: c.order, title: c.title,
        content: c.content, createdAt: now, updatedAt: now
      }));
      await DB.bulkPut("chapters", slice);
      $("#parseBar").style.width = Math.min(100, ((i + batch) / txtState.chapters.length) * 100) + "%";
      await new Promise((r) => setTimeout(r, 0));
    }
    invalidate(story.id);
    toast(`Đã lưu “${title}” với ${txtState.chapters.length} chương`);
    txtState = { raw: "", chapters: [], fileName: "", cover: "" };
    adminTab = "stories";
    render();
  };
}

/**
 * Tách văn bản thô thành danh sách chương.
 * Xử lý theo lô dòng và nhường luồng cho trình duyệt sau mỗi lô,
 * nhờ vậy file vài chục MB vẫn không làm treo giao diện.
 */
function parseTxtToChapters(raw, regex, onProgress) {
  return new Promise((resolve) => {
    const lines = String(raw || "").split("\n");
    const result = [];
    let buffer = [];
    let current = null;
    let i = 0;
    const CHUNK = 4000;

    const flush = () => {
      const content = buffer.join("\n").trim();
      if (current) {
        current.content = content;
        result.push(current);
      } else if (content) {
        result.push({ order: 0, title: "Lời mở đầu", content });
      }
      buffer = [];
    };

    const step = () => {
      const end = Math.min(i + CHUNK, lines.length);
      for (; i < end; i++) {
        const line = lines[i];
        const m = line.length < 200 ? line.match(regex) : null;
        if (m) {
          flush();
          const num = parseRomanOrInt(m[1]);
          current = { order: num, title: (m[2] || "").trim() || line.trim(), content: "" };
        } else {
          buffer.push(line);
        }
      }
      if (onProgress) onProgress(Math.round((i / Math.max(1, lines.length)) * 100));
      if (i < lines.length) setTimeout(step, 0);
      else {
        flush();
        // Chuẩn hóa số thứ tự: luôn liên tục từ 1 để điều hướng chính xác
        result.forEach((c, idx) => { c.order = idx + 1; });
        if (onProgress) onProgress(100);
        resolve(result);
      }
    };
    step();
  });
}

/** Đọc số chương ở cả dạng số Ả Rập và số La Mã. */
function parseRomanOrInt(token) {
  const t = String(token || "").trim();
  if (/^[0-9]+$/.test(t)) return parseInt(t, 10);
  const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  const up = t.toUpperCase();
  let total = 0;
  for (let i = 0; i < up.length; i++) {
    const cur = map[up[i]], next = map[up[i + 1]];
    if (!cur) return 0;
    total += next && next > cur ? -cur : cur;
  }
  return total;
}

/* --------- 11.4 Sao lưu & phục hồi --------- */
function panelBackup() {
  const panel = $("#adminPanel");
  panel.innerHTML = `
    <div class="two-col">
      <div class="card" style="padding:20px">
        <h3 style="margin-top:0;font-family:Literata,serif">Xuất dữ liệu</h3>
        <p class="muted" style="font-size:14px">Tải toàn bộ truyện, chương, ảnh bìa và cài đặt cá nhân về máy dưới dạng một file JSON.</p>
        <button class="btn btn-primary" id="exportBtn">Tải file sao lưu .json</button>
      </div>
      <div class="card" style="padding:20px">
        <h3 style="margin-top:0;font-family:Literata,serif">Nhập dữ liệu</h3>
        <p class="muted" style="font-size:14px">Chọn file .json đã sao lưu. Bạn sẽ được hỏi muốn gộp thêm hay thay thế toàn bộ kho hiện tại.</p>
        <input class="input" id="importFile" type="file" accept="application/json,.json">
      </div>
    </div>
    <div class="card" style="padding:20px;margin-top:18px">
      <h3 style="margin-top:0;font-family:Literata,serif">Xóa sạch dữ liệu</h3>
      <p class="muted" style="font-size:14px">Xóa mọi truyện, chương, lịch sử đọc và danh sách yêu thích trên trình duyệt này.</p>
      <button class="btn btn-danger" id="wipeBtn">Xóa toàn bộ dữ liệu</button>
    </div>`;

  $("#exportBtn").onclick = async () => {
    const data = {
      app: "thu-quan",
      version: 1,
      exportedAt: new Date().toISOString(),
      stories: await DB.all("stories"),
      chapters: await DB.all("chapters"),
      settings, favorites, history
    };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "thu-quan-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Đã tải file sao lưu");
  };

  $("#importFile").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch (err) { toast("File JSON không hợp lệ"); return; }
      if (!data || !Array.isArray(data.stories) || !Array.isArray(data.chapters)) {
        toast("File không đúng định dạng sao lưu của Thư Quán");
        return;
      }
      const replace = await confirmDialog(
        "Thay thế toàn bộ dữ liệu hiện tại?",
        `File chứa ${data.stories.length} truyện và ${data.chapters.length} chương. Chọn “Thay thế” để xóa kho hiện tại, hoặc “Hủy” rồi bấm lại để gộp thêm.`,
        "Thay thế"
      );
      if (replace) await DB.clearAll();
      await DB.bulkPut("stories", data.stories);
      for (let i = 0; i < data.chapters.length; i += 300) {
        await DB.bulkPut("chapters", data.chapters.slice(i, i + 300));
        await new Promise((r) => setTimeout(r, 0));
      }
      if (data.settings) { settings = Object.assign({}, DEFAULT_SETTINGS, data.settings); saveSettings(); applySettings(); }
      if (Array.isArray(data.favorites)) { favorites = data.favorites; saveFavorites(); }
      if (Array.isArray(data.history)) { history = data.history; saveHistory(); }
      invalidate();
      toast(`Đã nhập ${data.stories.length} truyện`);
      render();
    };
    reader.onerror = () => toast("Không đọc được file");
    reader.readAsText(f, "UTF-8");
  };

  $("#wipeBtn").onclick = async () => {
    const ok = await confirmDialog("Xóa toàn bộ dữ liệu?", "Mọi truyện, chương, lịch sử và yêu thích sẽ biến mất. Hãy xuất file sao lưu trước nếu cần.", "Xóa hết");
    if (!ok) return;
    await DB.clearAll();
    favorites = []; history = [];
    saveFavorites(); saveHistory();
    invalidate();
    toast("Đã xóa sạch toàn bộ dữ liệu");
    render();
  };
}

/* ---------------------------------------------------------------------
 * 12. Sự kiện toàn cục
 * ------------------------------------------------------------------ */
document.addEventListener("click", (e) => {
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) { go(navBtn.dataset.nav); return; }

  const card = e.target.closest("[data-story]");
  if (card) { go("#/story/" + encodeURIComponent(card.dataset.story)); return; }

  const fav = e.target.closest("[data-fav]");
  if (fav) {
    const id = fav.dataset.fav;
    if (favorites.includes(id)) { favorites = favorites.filter((x) => x !== id); toast("Đã bỏ theo dõi"); }
    else { favorites.push(id); toast("Đã thêm vào yêu thích"); }
    saveFavorites();
    render();
  }
});

$("#themeToggle").onclick = () => {
  settings.theme = settings.theme === "dark" ? "light" : "dark";
  saveSettings(); applySettings();
  toast(settings.theme === "dark" ? "Đang dùng nền tối" : "Đang dùng nền sáng");
};

$("#globalSearch").addEventListener("input", debounce((e) => {
  filterState.q = e.target.value;
  if (currentRoute.name === "library") refreshGrid();
  else go("#/library");
}, 220));

// Phím tắt: mũi tên trái/phải đổi chương, Esc thoát chế độ tập trung
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select")) return;
  if (currentRoute.name === "reader") {
    if (e.key === "ArrowLeft" && readerState.index > 0) {
      go(`#/read/${encodeURIComponent(readerState.story.id)}/${encodeURIComponent(readerState.chapters[readerState.index - 1].id)}`);
    } else if (e.key === "ArrowRight" && readerState.index < readerState.chapters.length - 1) {
      go(`#/read/${encodeURIComponent(readerState.story.id)}/${encodeURIComponent(readerState.chapters[readerState.index + 1].id)}`);
    }
  }
  if (e.key === "Escape") {
    if ($("#modalRoot").innerHTML) { closeModal(); return; }
    if (settings.focus) {
      settings.focus = false; saveSettings(); applySettings();
      document.body.classList.remove("focus-mode");
      toast("Đã tắt chế độ đọc tập trung");
    }
  }
});

window.addEventListener("hashchange", render);

/* ---------------------------------------------------------------------
 * 13. Khởi động ứng dụng
 * ------------------------------------------------------------------ */
(async function init() {
  applySettings();
  try {
    await DB.open();
  } catch (err) {
    console.error(err);
    view.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px"><strong>Trình duyệt chặn IndexedDB</strong>Ứng dụng cần IndexedDB để lưu truyện. Hãy tắt chế độ duyệt web riêng tư hoặc cho phép lưu dữ liệu cho trang này.</div></div>';
    return;
  }
  await purgeDemoDataOnce();
  await seedInitialStoryOnce();
  await addChapterTwoIfMissing();
  await refreshStories();
  if (!location.hash) location.hash = "#/";
  await render();
})();

})();
</script>
