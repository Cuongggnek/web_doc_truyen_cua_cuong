<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư Quán — Đọc truyện chữ</title>
<meta name="description" content="Thư Quán: ứng dụng đọc truyện chữ chạy hoàn toàn trên trình duyệt, lưu dữ liệu bằng IndexedDB.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   THƯ QUÁN — Hệ thống token giao diện
   Bảng màu: mực đen + ngọc bích (jade) + giấy dó. Chữ: Be Vietnam Pro (UI),
   Literata (nội dung đọc).
   ========================================================================= */
:root{
  --bg:#eef1ed;
  --surface:#ffffff;
  --surface-2:#e4e9e3;
  --text:#14201b;
  --muted:#5d6b63;
  --border:#d4dbd4;
  --accent:#1f6b4c;
  --accent-ink:#ffffff;
  --accent-soft:#dcece3;
  --warn:#9a3412;
  --radius-s:8px;
  --radius:14px;
  --radius-l:22px;
  --shadow-s:0 1px 2px rgba(20,32,27,.06);
  --shadow:0 12px 30px -18px rgba(20,32,27,.45);
  --maxw:1160px;
  --reader-font-size:19px;
  --reader-line:1.75;
  --reader-family:"Literata",Georgia,"Times New Roman",serif;
  --reader-measure:41rem;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0f1512;
  --surface:#161d19;
  --surface-2:#1e2723;
  --text:#e4eae5;
  --muted:#93a099;
  --border:#27322c;
  --accent:#5fc295;
  --accent-ink:#06120d;
  --accent-soft:#192b22;
  --warn:#f0a882;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
}
body[data-rt="sepia"]{background:#efe4cd}
body[data-rt="dark"]{background:#11130f}
body[data-rt="light"]{background:#e9ece8}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Thành phần dùng chung ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 15px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--warn);border-color:var(--border)}
.btn-danger:hover{background:var(--accent-soft)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-s);padding:10px 12px;font-size:15px;
}
textarea.input{resize:vertical;min-height:96px;line-height:1.6}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);
}
.chip-ongoing{background:var(--accent-soft);color:var(--accent)}
.chip-completed{background:#e7e2d3;color:#7a5c1e}
html[data-theme="dark"] .chip-completed{background:#2a2617;color:#d8bd72}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-s)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:34px 0 14px}
.section-head h2{font-family:"Literata",serif;font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.empty{
  border:1px dashed var(--border);border-radius:var(--radius);padding:38px 22px;text-align:center;color:var(--muted);
}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-family:"Literata",serif}

/* ---------- Header ---------- */
.site-header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.header-inner{max-width:var(--maxw);margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-mark{
  width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:"Literata",serif;font-weight:600;font-size:19px;
}
.brand-name{font-family:"Literata",serif;font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand-sub{display:block;font-size:11px;color:var(--muted);font-family:"Be Vietnam Pro",sans-serif;font-weight:400;letter-spacing:.02em}
.search-box{flex:1;max-width:420px;position:relative;margin-left:8px}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-box input{width:100%;padding:9px 14px 9px 38px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.header-actions .label{display:none}
@media (min-width:980px){.header-actions .label{display:inline}}
body.focus-mode .site-header,body.focus-mode .bottom-nav{display:none}

/* ---------- Trang chủ ---------- */
.hero{
  margin-top:22px;display:grid;gap:18px;grid-template-columns:1fr;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:26px;box-shadow:var(--shadow);
}
@media(min-width:820px){.hero{grid-template-columns:1.15fr .85fr;align-items:center;padding:34px}}
.hero h1{font-family:"Literata",serif;font-size:clamp(26px,4vw,38px);line-height:1.18;margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0 0 18px;color:var(--muted);max-width:46ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.resume-card{display:flex;gap:14px;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:14px}
.resume-card img,.resume-card .cover-fallback{width:58px;height:82px;border-radius:8px;object-fit:cover;flex:none}
.resume-card h3{margin:0 0 2px;font-size:15px;font-weight:600}
.resume-card p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.stat-strip{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.stat-strip div{display:flex;flex-direction:column}
.stat-strip b{font-family:"Literata",serif;font-size:22px;font-weight:600}
.stat-strip span{font-size:12px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 4px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 13px;font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}}
.story-card{
  display:flex;flex-direction:column;gap:8px;background:transparent;border:0;padding:0;text-align:left;cursor:pointer;
}
.cover{
  position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);
  border:1px solid var(--border);box-shadow:var(--shadow-s);
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-fallback{
  width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:12px;
  font-family:"Literata",serif;font-size:15px;color:var(--muted);
  background:linear-gradient(160deg,var(--surface-2),var(--accent-soft));
}
.cover .chip{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px)}
.story-card h3{margin:0;font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-card .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Chi tiết truyện ---------- */
.detail{display:grid;gap:26px;grid-template-columns:1fr;margin-top:24px}
@media(min-width:800px){.detail{grid-template-columns:240px 1fr}}
.detail .cover{aspect-ratio:2/3}
.detail h1{font-family:"Literata",serif;font-size:clamp(23px,3.4vw,32px);margin:0 0 8px;letter-spacing:-.02em;line-height:1.2}
.detail .byline{color:var(--muted);margin:0 0 14px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.desc{line-height:1.7;max-width:64ch}
.desc.collapsed{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.chapter-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.chapter-list{display:grid;gap:2px}
.chapter-row{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;
  background:transparent;cursor:pointer;border-bottom:1px solid var(--border);
}
.chapter-row:hover{background:var(--surface-2)}
.chapter-row .num{font-family:"Literata",serif;color:var(--muted);min-width:46px;font-size:14px}
.chapter-row .t{flex:1;font-size:14.5px}
.chapter-row .read-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* ---------- Trang đọc ---------- */
.reader-toolbar{
  position:sticky;top:0;z-index:35;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
body.focus-mode .reader-toolbar{position:fixed;left:0;right:0;transform:translateY(-102%);transition:transform .2s ease}
body.focus-mode .reader-toolbar:hover,body.focus-mode .reader-toolbar:focus-within{transform:translateY(0)}
.toolbar-inner{max-width:var(--maxw);margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px}
.toolbar-inner select{max-width:min(46vw,380px);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:14px}
.progress-track{height:3px;background:var(--border)}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .08s linear}
.reader-surface{min-height:70vh;padding:34px 18px 120px}
.reader-surface[data-rt="light"]{background:#ffffff;color:#14201b}
.reader-surface[data-rt="sepia"]{background:#f6ecd6;color:#4a3a27}
.reader-surface[data-rt="dark"]{background:#151814;color:#ddd9cf}
.reader-inner{max-width:var(--reader-measure);margin:0 auto}
.reader-inner .ch-title{font-family:var(--reader-family);font-size:calc(var(--reader-font-size) * 1.35);margin:0 0 6px;line-height:1.3;font-weight:600}
.reader-inner .ch-sub{font-size:13px;opacity:.65;margin:0 0 26px}
.reader-body{font-family:var(--reader-family);font-size:var(--reader-font-size);line-height:var(--reader-line)}
.reader-body p{margin:0 0 1.15em;text-align:justify;hyphens:auto}
.reader-nav{display:flex;gap:10px;justify-content:space-between;margin-top:38px;padding-top:20px;border-top:1px solid currentColor;border-color:color-mix(in srgb,currentColor 18%,transparent)}
.settings-pop{
  position:absolute;right:14px;top:calc(100% + 8px);width:min(320px,calc(100vw - 28px));
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;z-index:50;
}
.settings-pop h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg button{flex:1;min-width:64px;padding:8px 6px;border:1px solid var(--border);background:var(--surface);border-radius:9px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- Admin ---------- */
.admin-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:18px 0 8px}
.stat-card{padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border)}
.stat-card b{display:block;font-family:"Literata",serif;font-size:27px;font-weight:600;letter-spacing:-.02em}
.stat-card span{font-size:13px;color:var(--muted)}
.notice{
  border:1px solid var(--border);background:var(--accent-soft);color:var(--text);
  border-radius:var(--radius);padding:13px 15px;font-size:13.5px;line-height:1.6;margin:16px 0;
}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin:22px 0 18px}
.tabs button{
  border:0;background:transparent;padding:10px 14px;cursor:pointer;font-size:14.5px;font-weight:500;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table th{font-size:12.5px;color:var(--muted);font-weight:500}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.two-col{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:860px){.two-col{grid-template-columns:1fr 1fr}}
.preview-list{max-height:330px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.preview-list div.item{padding:10px 13px;border-bottom:1px solid var(--border)}
.preview-list div.item:last-child{border-bottom:0}
.preview-list .pt{font-weight:600;font-size:14px}
.preview-list .pp{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}

/* ---------- Modal, toast, bottom nav ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,14,11,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{
  background:var(--surface);border-radius:var(--radius-l);border:1px solid var(--border);
  width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow);padding:22px;
}
.modal h3{margin:0 0 14px;font-family:"Literata",serif;font-size:19px;font-weight:600}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:90vw}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:38;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.bottom-nav button{
  flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;font-size:11px;color:var(--muted);cursor:pointer;
}
.bottom-nav button[aria-current="true"]{color:var(--accent)}
@media(min-width:900px){.bottom-nav{display:none}}
main{padding-bottom:96px}
@media(min-width:900px){main{padding-bottom:56px}}
.site-footer{border-top:1px solid var(--border);margin-top:44px;padding:22px 0 30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="#/" id="brandLink">
      <span class="brand-mark">書</span>
      <span class="brand-name">Thư Quán<span class="brand-sub">Tủ truyện của riêng bạn</span></span>
    </a>
    <div class="search-box">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="globalSearch" type="search" placeholder="Tìm tên truyện hoặc tác giả" autocomplete="off" aria-label="Tìm truyện">
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" data-nav="#/favorites" title="Truyện yêu thích">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 4.65-7 9-7 9Z"></path></svg><span class="label">Yêu thích</span>
      </button>
      <button class="btn btn-ghost btn-sm" data-nav="#/history" title="Lịch sử đọc">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="label">Lịch sử</span>
      </button>
      <button class="btn btn-ghost btn-icon" id="themeToggle" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng/tối"></button>
      <button class="btn btn-sm" data-nav="#/admin" id="adminBtn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3 4 6.5v5c0 4.5 3.3 8.3 8 9.5 4.7-1.2 8-5 8-9.5v-5Z"></path></svg><span class="label">Quản trị</span>
      </button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="bottom-nav" id="bottomNav">
  <button data-nav="#/" data-key="home"><svg class="icon" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"></path></svg>Trang chủ</button>
  <button data-nav="#/library" data-key="library"><svg class="icon" viewBox="0 0 24 24"><path d="M5 4h5v16H5zM14 4h5v16h-5z"></path></svg>Kho truyện</button>
  <button data-nav="#/favorites" data-key="favorites"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 4.65-7 9-7 9Z"></path></svg>Yêu thích</button>
  <button data-nav="#/history" data-key="history"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Lịch sử</button>
  <button data-nav="#/admin" data-key="admin"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3 4 6.5v5c0 4.5 3.3 8.3 8 9.5 4.7-1.2 8-5 8-9.5v-5Z"></path></svg>Quản trị</button>
</nav>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =========================================================================
 * THƯ QUÁN — Web Reader chạy hoàn toàn phía client
 * Kiến trúc: Vanilla JS ES6+, SPA định tuyến bằng hash, dữ liệu lưu trong
 * IndexedDB (truyện/chương/ảnh bìa) và localStorage (cài đặt cá nhân).
 * ========================================================================= */
(function () {
"use strict";

/* ---------------------------------------------------------------------
 * 0. Tiện ích chung
 * ------------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** Sinh id duy nhất dạng chuỗi ngắn, đủ dùng cho ứng dụng client. */
const uid = (p = "id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/** Chuyển ký tự nguy hiểm thành entity để chèn an toàn vào innerHTML. */
function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/** Bỏ dấu tiếng Việt để tìm kiếm không phân biệt dấu. */
function slugify(str) {
  return String(str || "").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").trim();
}

function debounce(fn, ms = 220) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function throttle(fn, ms = 400) {
  let last = 0, timer = null;
  return (...a) => {
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...a); }
    else { clearTimeout(timer); timer = setTimeout(() => { last = Date.now(); fn(...a); }, ms - (now - last)); }
  };
}
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function fmtRelative(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "vừa xong";
  if (m < 60) return m + " phút trước";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " giờ trước";
  const d = Math.floor(h / 24);
  if (d < 30) return d + " ngày trước";
  return fmtDate(ts);
}
function fmtBytes(n) {
  if (!n && n !== 0) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}

/** Toast thông báo ngắn ở đáy màn hình. */
function toast(msg, ms = 2600) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ---------------------------------------------------------------------
 * 1. Tầng IndexedDB
 * ------------------------------------------------------------------ */
const DB = {
  name: "thuquan_db",
  version: 1,
  handle: null,

  /** Mở kết nối và tạo object store nếu chưa có. */
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("stories")) {
          const s = db.createObjectStore("stories", { keyPath: "id" });
          s.createIndex("updatedAt", "updatedAt");
        }
        if (!db.objectStoreNames.contains("chapters")) {
          const c = db.createObjectStore("chapters", { keyPath: "id" });
          c.createIndex("storyId", "storyId");
          c.createIndex("storyOrder", ["storyId", "order"]);
        }
      };
      req.onsuccess = () => { this.handle = req.result; resolve(this.handle); };
      req.onerror = () => reject(req.error);
    });
  },

  /** Bọc IDBRequest thành Promise. */
  _p(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  },

  store(name, mode = "readonly") {
    return this.handle.transaction(name, mode).objectStore(name);
  },

  all(storeName) { return this._p(this.store(storeName).getAll()); },
  get(storeName, key) { return this._p(this.store(storeName).get(key)); },
  put(storeName, value) { return this._p(this.store(storeName, "readwrite").put(value)); },
  del(storeName, key) { return this._p(this.store(storeName, "readwrite").delete(key)); },

  /** Ghi nhiều bản ghi trong MỘT transaction để tăng tốc khi import. */
  bulkPut(storeName, items) {
    return new Promise((resolve, reject) => {
      const tx = this.handle.transaction(storeName, "readwrite");
      const st = tx.objectStore(storeName);
      items.forEach((it) => st.put(it));
      tx.oncomplete = () => resolve(items.length);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },

  clearAll() {
    return new Promise((resolve, reject) => {
      const tx = this.handle.transaction(["stories", "chapters"], "readwrite");
      tx.objectStore("stories").clear();
      tx.objectStore("chapters").clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  },

  /** Lấy toàn bộ chương của một truyện, đã sắp xếp theo số thứ tự. */
  async chaptersOf(storyId) {
    const list = await this._p(this.store("chapters").index("storyId").getAll(storyId));
    return list.sort((a, b) => a.order - b.order);
  },

  /** Xóa truyện kèm toàn bộ chương của nó. */
  deleteStoryCascade(storyId) {
    return new Promise((resolve, reject) => {
      const tx = this.handle.transaction(["stories", "chapters"], "readwrite");
      tx.objectStore("stories").delete(storyId);
      const idx = tx.objectStore("chapters").index("storyId");
      const cur = idx.openCursor(IDBKeyRange.only(storyId));
      cur.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { c.delete(); c.continue(); }
      };
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    console.warn("Không đọc được localStorage:", key, err);
    return fallback;
  }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (err) { console.warn("Không ghi được localStorage:", key, err); }
}

/** Ghi nhận vị trí đọc; mỗi truyện chỉ giữ một mục lịch sử mới nhất. */
function trackHistory(story, chapter, scroll) {
  const entry = {
    storyId: story.id, storyTitle: story.title, cover: story.cover || "",
    chapterId: chapter.id, chapterTitle: chapter.title, order: chapter.order,
    scroll: Math.max(0, Math.round(scroll || 0)), at: Date.now()
  };
  history = history.filter((h) => h.storyId !== story.id);
  history.unshift(entry);
  if (history.length > 60) history = history.slice(0, 60);
  saveHistory();
}
function historyOf(storyId) { return history.find((h) => h.storyId === storyId) || null; }

/* ---------------------------------------------------------------------
 * 3. Bộ nhớ đệm trong RAM + dữ liệu mẫu
 * ------------------------------------------------------------------ */
let stories = [];                 // cache toàn bộ truyện
const chapterCache = new Map();   // storyId -> mảng chương (đã sắp xếp)

async function refreshStories() {
  stories = await DB.all("stories");
  stories.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return stories;
}
async function getChapters(storyId, force = false) {
  if (!force && chapterCache.has(storyId)) return chapterCache.get(storyId);
  const list = await DB.chaptersOf(storyId);
  chapterCache.set(storyId, list);
  return list;
}
function invalidate(storyId) { if (storyId) chapterCache.delete(storyId); else chapterCache.clear(); }
function storyById(id) { return stories.find((s) => s.id === id) || null; }

const SEED_TITLES = ["Gió Qua Đồi Sim", "Người Gác Hải Đăng Cuối Cùng"];
async function purgeDemoDataOnce() {
  if (localStorage.getItem("tq.demoPurged.v1") === "1") return;
  try {
    const all = await DB.all("stories");
    const demo = all.filter((s) => SEED_TITLES.includes(s.title));
    for (const s of demo) {
      await DB.deleteStoryCascade(s.id);
      favorites = favorites.filter((id) => id !== s.id);
      history = history.filter((h) => h.storyId !== s.id);
    }
    if (demo.length) { saveFavorites(); saveHistory(); invalidate(); }
  } catch (err) {
    console.warn("Không dọn được dữ liệu mẫu cũ:", err);
  }
  localStorage.setItem("tq.demoPurged.v1", "1");
}

    title: "Người đã bỏ lỡ thanh xuân",
    content: "Phòng họp tầng ba mươi hai yên tĩnh đến mức có thể nghe rõ tiếng kim giây chạy qua từng nhịp. Trương Quang ngồi ở vị trí chủ tọa, lưng tựa nhẹ vào ghế, ánh mắt bình thản lướt qua tập tài liệu đặt trước mặt.\n\nNgười đàn ông đối diện đã nói liên tục gần hai mươi phút, từ mức giá, điều khoản hợp tác cho đến những lợi ích mà công ty của hắn có thể mang lại. Quang không ngắt lời. Hắn chỉ thỉnh thoảng lật một trang giấy, ngón tay gõ nhẹ lên mặt bàn, đôi mắt không có quá nhiều cảm xúc.\n\nĐến khi đối phương nói xong, Quang mới khép tập tài liệu lại.\n\n\"Điều khoản thứ bảy, sửa.\"\n\nChỉ ba chữ. Người đối diện khựng lại.\n\n\"Trương tổng, điều khoản đó đã được chúng tôi cân nhắc rất kỹ. Nếu sửa theo ý anh thì phần lợi nhuận của phía chúng tôi sẽ giảm khá nhiều.\"\n\nQuang ngước mắt lên. \"Vậy thì không ký.\"\n\nKhông có uy hiếp, cũng chẳng có vẻ tức giận. Chỉ là một câu nói bình thản đến mức khiến cả căn phòng im xuống.\n\nĐối phương nhìn người đàn ông trước mặt vài giây rồi cuối cùng cũng bật cười khổ. \"Đúng là Trương tổng. Hơn ba mươi tuổi mà khí thế vẫn khiến người ta không dám nói đùa.\"\n\nQuang không đáp. Hắn đã quen với những lời như vậy.\n\nHơn ba mươi tuổi, một tay gây dựng sự nghiệp, trở thành tổng giám đốc của một tập đoàn lớn, tài sản cá nhân vượt xa phần lớn những người cùng thế hệ. Ở Tuyên Quang, cái tên Trương Quang gần như đã trở thành một loại bảo chứng. Người ta nói hắn có đầu óc kinh doanh đáng sợ, quyết đoán, tỉnh táo và đặc biệt không để cảm xúc ảnh hưởng đến công việc.\n\nNhưng cũng chính vì vậy mà người ta thường quên mất một chuyện rất đơn giản. Hắn cũng là con người.\n\n\"À phải rồi.\" Đối tác bỗng dựa người về phía trước, vẻ mặt trở nên có chút trêu chọc. \"Trương tổng, anh cũng hơn ba mươi rồi nhỉ?\"\n\nQuang nhướng mắt. \"Có vấn đề?\"\n\n\"Không có, không có.\" Người kia cười. \"Tôi chỉ thấy lạ thôi. Một người vừa có tiền, vừa có địa vị, ngoại hình cũng chẳng đến nỗi nào, vậy mà đến giờ vẫn chưa có vợ. Nghe nói bạn gái cũng chẳng có?\"\n\nCăn phòng lại im lặng. Quang nhìn hắn. Một ánh mắt rất bình thường. Không lạnh lẽo, không tức giận, cũng chẳng có ý cảnh cáo. Nhưng chỉ một thoáng đó, nụ cười trên mặt đối tác lập tức cứng lại.\n\nNgười kia ho khan hai tiếng rồi ngồi thẳng lưng. \"Tôi chỉ đùa một chút.\"\n\nQuang thu ánh mắt về. \"Ừ.\"\n\nĐối phương vốn định nói tiếp, nhưng sau khi nhìn thấy vẻ mặt bình thản của hắn thì lập tức nuốt những lời còn lại xuống bụng. Chẳng hiểu sao hắn cảm thấy nếu tiếp tục chủ đề này thì hợp đồng vài trăm tỷ trước mặt có thể cũng chẳng còn ý nghĩa gì nữa.\n\nTuy nhiên, sau khi cuộc đàm phán kết thúc, Quang vẫn nhớ đến câu nói ấy. Không phải vì hắn khó chịu. Trái lại, hắn chẳng có cảm giác gì đặc biệt.\n\nHơn ba mươi tuổi mà chưa kết hôn, chưa có người yêu. Chuyện đó với hắn vốn chẳng đáng để suy nghĩ.\n\nHắn từng có thời gian yêu đương. Từng có những người xuất hiện trong cuộc đời hắn. Nhưng rồi công việc cuốn đi tất cả. Khi người khác nghỉ lễ, hắn ngồi trong phòng họp. Khi người khác đưa người yêu đi chơi, hắn bay sang tỉnh khác để ký hợp đồng. Khi người khác bắt đầu nghĩ đến chuyện lập gia đình, hắn còn đang đau đầu vì một dự án mới.\n\nCứ như vậy, năm này qua năm khác. Đến lúc ngẩng đầu lên, hắn đã hơn ba mươi.\n\nKhông vợ. Không người yêu. Không con cái. Cũng chẳng có một mối quan hệ nào đủ sâu để khiến hắn cảm thấy mình thật sự thuộc về một nơi nào đó.\n\nNhưng Quang chưa từng than thở về điều ấy. Ít nhất là trước hôm nay.\n\nĐối với hắn, cuộc sống chỉ đơn giản là một chuỗi lựa chọn. Hắn chọn sự nghiệp. Và hắn có được thứ mình muốn. Vậy là đủ.\n\nHoặc hắn từng nghĩ như vậy.\n\nTrời tối rất nhanh. Sau khi rời khỏi cuộc gặp, Quang tự mình lái xe về nhà. Hắn không thích tài xế đi theo mỗi khi lịch trình kết thúc muộn. Một mình trong khoang xe yên tĩnh khiến hắn có thời gian suy nghĩ.\n\nThành phố bên ngoài cửa kính lướt qua thành những vệt sáng kéo dài. Quang một tay đặt trên vô lăng, tay còn lại chống nhẹ lên cửa xe. Trong đầu hắn vẫn là những con số, những điều khoản, những kế hoạch cho tháng tới.\n\nNgày mai còn một cuộc họp. Cuối tuần phải sang Hà Nội. Tháng sau có một dự án cần giải quyết.\n\nMột cuộc đời được xếp kín bằng lịch trình.\n\nĐôi khi Quang cũng tự hỏi, từ lúc nào cuộc sống của hắn lại trở thành như vậy? Nhưng câu hỏi vừa xuất hiện đã nhanh chóng biến mất. Hắn không có thói quen suy nghĩ những chuyện không mang lại kết quả.\n\nĐèn xe phía trước đột nhiên lóe lên. Một tiếng còi chói tai vang lên.\n\nQuang chỉ kịp nhìn thấy ánh sáng trắng xé ngang tầm mắt. Sau đó là một tiếng va chạm khủng khiếp.\n\nCơ thể hắn mất đi cảm giác trong khoảnh khắc. Mọi âm thanh xung quanh trở nên xa dần. Ý thức chìm xuống một khoảng tối không đáy.\n\nKhông đau. Không sợ. Chỉ có một ý nghĩ rất kỳ lạ lướt qua đầu hắn.\n\nHôm nay... mình còn chưa về nhà.\n\nRồi tất cả biến mất.\n\nKhông biết bao lâu sau, Quang nghe thấy tiếng người. Rất gần.\n\n\"Ê, này...\"\n\nHắn cau mày. Ý thức từ từ trở lại. Đầu nặng trĩu. Cơ thể nhẹ đến kỳ lạ.\n\nQuang cố mở mắt. Một khuôn mặt xa lạ lập tức đập vào tầm nhìn. Là một nam sinh. Đồng phục trắng, mái tóc hơi rối, gương mặt còn mang vẻ non nớt đặc trưng của tuổi học sinh.\n\nĐiều khiến Quang giật mình không phải khuôn mặt đó, mà là khoảng cách. Thằng nhóc đang cúi sát xuống nhìn hắn, đôi mắt mở lớn như đang nhìn thấy một sinh vật ngoài hành tinh.\n\nQuang theo bản năng bật người ngồi dậy.\n\n\"...\"\n\nKhông có cơn đau nào. Không có tiếng kim loại méo mó. Không có mùi khói. Không có tiếng còi xe.\n\nTrước mắt hắn là một căn phòng xa lạ. Bàn ghế. Tường sơn cũ. Một chiếc bảng đen. Ánh nắng xuyên qua cửa sổ. Và đặc biệt, trên bàn học trước mặt hắn là một cuốn vở với nét chữ mà hắn không thể nào quen thuộc hơn.\n\nQuang chết lặng.\n\nHắn đưa tay lên nhìn. Bàn tay trẻ hơn rất nhiều. Không có những dấu vết của hơn mười năm làm việc. Không có cảm giác nặng nề của một cơ thể đã quen với những đêm thức trắng.\n\nHắn sờ lên mặt mình, rồi nhìn quanh căn phòng. Những học sinh khác cũng đang nhìn hắn. Một vài người còn đang nói chuyện, vài người cúi xuống viết bài. Tiếng quạt trần quay đều trên đầu.\n\nMọi thứ chân thật đến mức không thể là một giấc mơ.\n\nTrong đầu Quang xuất hiện vô số khả năng. Bệnh viện. Ảo giác. Chấn thương não. Một trò đùa nào đó.\n\nNhưng rồi hắn nhìn thấy tờ lịch treo trên tường. Một ngày tháng quen thuộc. Một năm mà hắn đã tưởng rằng mình sẽ không bao giờ được nhìn thấy nữa.\n\nQuang im lặng rất lâu. Hắn không cần bất kỳ lời giải thích nào. Những ký ức bị phủ bụi trong đầu bắt đầu hiện lên từng chút một.\n\nNgôi trường cũ. Những dãy phòng học. Những tiết học buồn ngủ. Những người bạn mà sau này đã dần biến mất khỏi cuộc đời hắn.\n\nVà quan trọng nhất... tuổi mười bảy.\n\nHắn thật sự đã quay về.\n\nTrùng sinh. Một từ vốn chỉ tồn tại trong những cuốn tiểu thuyết mà trước đây hắn từng thấy người khác đọc. Nếu có ai nói với Quang của ngày hôm qua rằng sau một vụ tai nạn hắn sẽ tỉnh lại ở tuổi mười bảy, hắn chắc chắn sẽ cho rằng người đó bị điên.\n\nNhưng bây giờ, chính hắn lại đang ngồi ở đây.\n\nQuang cúi đầu nhìn hai bàn tay mình. Rất lâu hắn không nói gì. Trong đầu hắn không có tiếng reo mừng. Cũng chẳng có sự hoảng loạn như người bình thường có lẽ sẽ có.\n\nThứ xuất hiện đầu tiên lại là một cảm giác trống rỗng.\n\nMột đời người. Hơn ba mươi năm. Hắn đã dùng phần lớn thời gian đó để theo đuổi tiền bạc, địa vị và thành công. Hắn từng nghĩ mình không có gì phải hối tiếc.\n\nNhưng giờ đây, khi cơ hội được quay lại đặt ngay trước mắt, những thứ hắn từng cho rằng không quan trọng lại lần lượt xuất hiện trong tâm trí.\n\nMột bữa cơm gia đình mà hắn thường xuyên bỏ lỡ. Những người bạn thời cấp ba mà hắn từng chẳng buồn giữ liên lạc. Những ngày nghỉ chỉ nằm trong phòng làm việc. Những buổi chiều mùa hè mà hắn không bao giờ có mặt ở sân trường.\n\nVà cả câu nói của đối tác lúc chiều nay.\n\nHơn ba mươi tuổi rồi mà vẫn chưa có vợ. Chưa có người yêu.\n\nQuang bỗng bật cười rất khẽ.\n\nHóa ra không phải hắn không có gì để tiếc. Chỉ là đến khi mất đi cơ hội quay lại, hắn mới biết mình đã bỏ qua quá nhiều thứ.\n\nHắn ngẩng đầu nhìn ra ngoài cửa sổ. Bầu trời xanh đến mức xa lạ. Một màu xanh mà hắn đã rất lâu rồi không còn thời gian để ngẩng lên nhìn.\n\nQuang siết nhẹ bàn tay.\n\nNếu ông trời thật sự cho hắn thêm một lần nữa... vậy thì lần này hắn sẽ không sống giống kiếp trước.\n\nTiền? Hắn đã biết cách kiếm tiền.\n\nQuyền lực? Hắn từng đứng ở nơi mà rất nhiều người cả đời cũng không thể chạm tới.\n\nThành công? Hắn đã có rồi.\n\nNhưng thanh xuân thì khác. Thứ đó một khi đi qua sẽ không bao giờ quay lại.\n\nVậy mà bây giờ, nó đang nằm trong tay hắn.\n\nQuang nhìn đám học sinh trước mặt, trong lòng lần đầu tiên sau rất nhiều năm xuất hiện một suy nghĩ không liên quan đến công việc.\n\nLần này... sống cho mình một lần đi.",
    createdAt: now,
    updatedAt: now
  };
  await DB.put("stories", story);
  await DB.bulkPut("chapters", [chapter]);
  invalidate(story.id);
  await addChapterTwoIfMissing(story.id);
}

/**
 * Bổ sung chương 2 của truyện khởi tạo nếu truyện đã tồn tại nhưng
 * chưa có chương này (áp dụng cho cả web mới lẫn bản đã mở trước đó,
 * chạy nhẹ mỗi lần khởi động, không tạo trùng nếu chương đã có).
 */
async function addChapterTwoIfMissing(knownStoryId) {
  let storyId = knownStoryId;
  if (!storyId) {
    const all = await DB.all("stories");
    const s = all.find((x) => x.title === "TÔI ĐÉO MUỐN TRÙNG SINH ĐÂU");
    if (!s) return;
    storyId = s.id;
  }
  const chs = await DB.chaptersOf(storyId);
  if (chs.some((c) => c.order === 2)) return;

  const now = Date.now();
  await DB.put("chapters", {
    id: uid("ch"),
    storyId,
    order: 2,
    title: "Những điều đã quên",
    content: "Quang ngồi im thêm một lúc, ánh mắt vẫn đặt ngoài cửa sổ. Gió cuối buổi sáng lùa qua khe cửa, mang theo mùi nắng và bụi phấn quen thuộc đến kỳ lạ. Hắn không biết mình đã ngồi như vậy bao lâu, cho đến khi vô thức quay đầu nhìn lên chiếc đồng hồ treo trên tường. Kim phút đang chỉ qua số hai. 11 giờ 17 phút.\n\nQuang hơi khựng lại. 11 giờ 17. Hắn nhìn con số đó vài giây rồi mới chợt nhận ra, theo thời gian biểu của trường, chỉ còn hơn mười phút nữa là tan học.\n\nTan học. Hai chữ rất bình thường, nhưng với Quang của nhiều năm sau, nó lại xa lạ đến mức khiến hắn phải mất vài giây mới hiểu được mình sắp phải làm gì. Trước đây, giờ này có lẽ hắn đang ngồi trong phòng họp hoặc dùng bữa trưa với đối tác. Còn bây giờ, việc quan trọng nhất trong lịch trình của hắn là... về nhà sau khi tan học.\n\nQuang khẽ day trán. Vãi thật. Cuộc đời đúng là biết cách đùa người.\n\nHắn vừa định quay sang nhìn người ngồi bên cạnh thì một cục tẩy bay ngang trước mặt. Quang nghiêng đầu tránh theo bản năng. Cục tẩy đập vào tường rồi rơi xuống đất.\n\nNgười bên cạnh chẳng những không có vẻ hối lỗi mà còn cúi xuống nhặt nó lên, phủi phủi hai cái rồi đặt ngay ngắn lên mép bàn như chưa từng có chuyện gì xảy ra.\n\nQuang nhìn cậu ta. Đây là người đã ngồi cạnh hắn từ đầu tiết đến giờ. Một nam sinh có khuôn mặt khá sáng, tóc cắt ngắn nhưng phần mái trước trán cứ dựng lên một cách không chịu hợp tác. Cậu ta có đôi mắt to, hàng lông mày hơi cong, khuôn mặt vẫn còn nguyên nét trẻ con của tuổi học sinh. Trên bàn là một đống sách vở bị xếp thành hình thù chẳng khác gì bãi chiến trường.\n\nCậu ta tên Hoàng Cường. Ít nhất đó là cái tên Quang vừa moi được từ ký ức mơ hồ của mình.\n\nCường liếc sang hắn, thấy Quang đang nhìn thì lập tức nhăn mặt. Cậu ta không nói gì, chỉ chậm rãi lấy một chiếc bút đặt ngang môi, làm bộ như đang hút thuốc, sau đó còn nghiêng đầu nhìn ra cửa sổ với vẻ mặt cực kỳ nghiêm túc.\n\nQuang nhìn vài giây.\n\n\"...\"\n\nCường vẫn giữ nguyên tư thế. Một lúc sau, cậu ta không nhịn được, tự bật cười.\n\nQuang quay mặt đi. Hắn bắt đầu hiểu vì sao trí nhớ của mình lại có hình ảnh thằng này. Đúng kiểu một đứa trẻ chưa chịu lớn.\n\nTiết học cuối cùng trôi qua trong tiếng giáo viên giảng bài và tiếng bút viết sột soạt. Quang gần như không tiếp thu được gì. Không phải vì hắn không hiểu bài, mà bởi vì hắn đang cố ghép lại những mảnh ký ức cũ trong đầu.\n\nMỗi khi nhìn một khuôn mặt, một góc lớp hay một món đồ, một cảm giác quen thuộc lại xuất hiện. Có thứ hắn nhớ rõ. Có thứ chỉ còn lại một cái bóng mờ nhạt. Có những người hắn biết mình từng thân, nhưng hiện tại thậm chí còn không nhớ nổi lần cuối gặp họ là khi nào.\n\nCảm giác đó rất kỳ quái. Giống như đang cầm một quyển sách mà bản thân từng đọc từ rất lâu, biết phần cuối của câu chuyện nhưng lại không thể nhớ chính xác từng dòng ở đầu sách.\n\nTiếng chuông tan học vang lên. Cả lớp lập tức sống lại. Ghế kéo loạt xoạt, tiếng nói chuyện nổi lên khắp nơi.\n\nCường vừa nghe tiếng chuông đã bật dậy như lò xo, nhét sách vào cặp mà chẳng thèm xếp ngay ngắn. Một quyển vở bị kẹt ở miệng cặp, cậu ta kéo mãi không được, cuối cùng dùng cả hai tay giật mạnh. Quyển vở bay thẳng xuống đất.\n\nCường cúi xuống nhặt, phủi bụi, nhìn nó một lúc rồi... nhét ngược trở lại.\n\nQuang nhìn mà không nói gì. Hắn từng quản lý hàng trăm nhân viên. Từng xử lý những bản hợp đồng trị giá hàng chục tỷ. Nhưng trước một thằng nhóc có thể nhét vở vào cặp ngược đầu như thế này, hắn thực sự không biết nên dùng năng lực quản lý ở đâu.\n\n\"Quang, về không?\" Cường hỏi.\n\nQuang gật đầu. \"Ừ.\"\n\nHai người theo dòng học sinh đi ra khỏi lớp. Vừa bước xuống cầu thang, Quang đã bắt đầu gặp vấn đề. Hắn biết mình phải về nhà. Nhưng nhà ở đâu?\n\nTrong ký ức có một địa chỉ. Vấn đề là con đường từ trường về đó trong đầu hắn giống như một tấm bản đồ bị xé mất một nửa.\n\nQuang đứng giữa sân trường, nhìn hàng xe đạp điện phía trước mà im lặng. Hàng trăm chiếc xe chen chúc nhau dưới mái che. Chiếc nào cũng có vẻ giống chiếc nào.\n\nQuang đứng nhìn một lúc lâu. Đột nhiên hắn nhớ ra. Xe của mình.\n\nHắn từng có một chiếc xe đạp điện cũ, màu sắc đã phai đi vì sử dụng lâu ngày. Một chiếc xe chẳng có gì đặc biệt. Thế nhưng sau hơn mười năm, Quang đã quen với vô lăng ô tô, những chiếc xe sang trọng và những tài xế riêng, đến mức hắn gần như quên mất cảm giác tự mình tìm xe giữa một bãi xe trường học.\n\nHắn đi dọc từng hàng. Một chiếc màu đen. Không phải. Một chiếc trắng. Cũng không. Chiếc màu xanh. Không nhớ.\n\nQuang đứng giữa bãi xe, cau mày. Hắn bắt đầu cảm thấy mình đang làm một việc vô cùng ngu ngốc. Một tổng giám đốc hơn ba mươi tuổi từng có thể nhớ từng con số trong bảng tài chính, bây giờ lại không nhớ nổi xe đạp điện của mình trông như thế nào.\n\n\"Quang!\" Một giọng nữ vang lên phía sau.\n\nHắn quay lại. Một cô gái đang đứng cách đó vài bước. Cô có mái tóc đen dài ngang lưng, được buộc gọn bằng một chiếc dây màu xanh nhạt. Gương mặt thanh tú, làn da sáng, đôi mắt hơi cong khi cười. Đồng phục được mặc ngay ngắn, trên tay ôm vài quyển sách.\n\nKhông phải kiểu đẹp khiến người ta phải lập tức chú ý giữa đám đông, nhưng có một vẻ sạch sẽ và dịu dàng rất dễ khiến người khác nhớ.\n\nCô bước lại gần, hơi đưa cuốn sách trên tay về phía Quang. \"Cậu quên sách này.\"\n\nQuang nhìn cuốn sách. Sau vài giây hắn mới nhận ra đó là sách của mình. \"À.\"\n\nCô gái nhìn hắn. \"Cậu hôm nay lạ thật đấy. Bình thường cậu có bao giờ quên đồ đâu?\"\n\nQuang im lặng. Một lần nữa hắn phải đối mặt với sự thật rằng ký ức của mình đang có những khoảng trống chết tiệt.\n\nCô gái không để ý, chỉ đưa sách cho hắn. \"Tôi là Thùy Dung.\"\n\nQuang nhìn cô. Cái tên lập tức hiện lên trong ký ức. Bạn học cùng lớp. Học khá. Tính cách nhẹ nhàng, ít nói, nhưng khá để ý đến những người xung quanh.\n\n\"Cảm ơn.\" Quang nhận lấy sách.\n\nDung gật đầu rồi quay đi. Nhưng mới đi được vài bước, cô lại quay đầu. \"Quang.\"\n\n\"Ừ?\"\n\n\"Xe cậu ở bên kia.\" Cô chỉ tay.\n\nQuang nhìn theo hướng đó. Một chiếc xe đạp điện cũ nằm gần cuối dãy. Màu sơn đã phai, phần tay lái có một vết xước khá dài. Hắn đi tới, nhìn nó vài giây.\n\nĐúng rồi. Là nó.\n\nQuang bật cười trong lòng. Một chiếc xe cũ kỹ như vậy mà hắn đã phải tìm gần mười phút. Nếu chuyện này bị những người từng làm việc với hắn biết được, chắc họ sẽ nghĩ tổng giám đốc Trương hôm nay bị mất trí.\n\nHắn dắt xe ra khỏi hàng. Nhưng vừa đi được vài bước, Quang bỗng dừng lại.\n\nDưới chiếc xe đậu bên cạnh, có thứ gì đó đang động đậy. Một tiếng rên khe khẽ vang lên.\n\nQuang cúi xuống. Một chú chó con nhỏ đang nép sát vào bánh xe. Bộ lông vàng nhạt dính vài hạt bụi, hai tai cụp xuống, cả người run nhẹ. Nó nhìn Quang bằng đôi mắt đen láy rồi lập tức co người lại.\n\nQuang ngồi xổm xuống. Hắn đưa tay ra nhưng con chó lập tức lùi sâu hơn.\n\n\"Sợ à?\" Hắn nói rất khẽ.\n\nCó lẽ chính Quang cũng không biết tại sao mình lại nói câu đó. Một lúc sau, hắn chậm rãi đặt bàn tay xuống đất, không tiến thêm.\n\nCon chó nhìn hắn. Quang nhìn lại nó. Hai bên cứ như vậy vài giây. Cuối cùng, con chó nhỏ rụt rè tiến lại gần, ngửi ngửi đầu ngón tay hắn.\n\nQuang nhẹ nhàng bế nó lên. Hắn cúi đầu nhìn con chó. Nó vẫn còn run, nhưng đã không chống cự nữa.\n\nĐúng lúc ấy, từ phía bên kia bãi xe vang lên tiếng sủa. Một con chó lớn hơn chạy tới. Nó dừng lại cách Quang vài bước, cảnh giác nhìn hắn.\n\nQuang nhìn con chó trong tay mình, rồi lại nhìn con chó lớn. Hắn lập tức hiểu ra.\n\n\"Mẹ mày à?\" Quang khẽ nói.\n\nHắn ngồi xuống, đặt chó con xuống đất. Nó vừa chạm đất đã lập tức chạy về phía con chó mẹ. Con chó lớn cúi đầu liếm lên bộ lông của nó, sau đó dùng thân mình che chắn cho con.\n\nQuang ngồi yên nhìn cảnh đó. Không hiểu vì sao, lồng ngực hắn bỗng nặng xuống.\n\nHình ảnh con chó mẹ che lấy chó con khiến hắn nghĩ tới bố mẹ mình. Một cảm giác rất cũ len vào trong lòng. Hắn nhớ đến căn nhà ngày trước. Nhớ những bữa cơm mà hắn từng viện đủ lý do để không về. Nhớ những cuộc điện thoại mà đôi khi hắn nhìn thấy nhưng vì đang họp nên bỏ qua.\n\nCó những thứ lúc còn có thì hắn chẳng bao giờ nghĩ đến. Đến khi mất đi rồi, dù có bao nhiêu tiền cũng không mua lại được.\n\nQuang cúi đầu. Hắn bỗng thấy mình thật may mắn. Bởi ít nhất, lần này hắn còn cơ hội.\n\nCơ hội để nhìn thấy họ khi họ vẫn còn trẻ. Cơ hội để ăn một bữa cơm bình thường. Cơ hội để nghe những lời cằn nhằn mà ngày trước hắn từng thấy phiền.\n\nNghĩ đến đó, Quang đứng dậy, dắt chiếc xe đạp điện cũ ra khỏi sân trường. Hắn quay đầu nhìn hai mẹ con chó lần cuối. Chó con đã nép sát vào bụng mẹ, cái đuôi nhỏ khẽ ve vẩy.\n\nQuang nhìn cảnh ấy thêm vài giây rồi mới quay đi.\n\nHắn không biết phía trước sẽ có những gì. Cũng không biết tương lai mà mình từng tạo ra có còn giống trước kia hay không.\n\nNhưng có một chuyện hắn đã chắc chắn.\n\nKiếp này, hắn sẽ không để những người quan trọng với mình phải đứng sau công việc nữa.",
    createdAt: now,
    updatedAt: now
  });
  invalidate(storyId);
}

/* ---------------------------------------------------------------------
 * 4. Định tuyến SPA bằng hash
 * ------------------------------------------------------------------ */
const view = $("#view");

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function parseRoute() {
  const raw = (location.hash || "#/").slice(1);
  const parts = raw.split("/").filter(Boolean);
  if (parts.length === 0) return { name: "home" };
  if (parts[0] === "library") return { name: "library" };
  if (parts[0] === "favorites") return { name: "favorites" };
  if (parts[0] === "history") return { name: "history" };
  if (parts[0] === "admin") return { name: "admin" };
  if (parts[0] === "story") return { name: "detail", storyId: decodeURIComponent(parts[1] || "") };
  if (parts[0] === "read") {
    return { name: "reader", storyId: decodeURIComponent(parts[1] || ""), chapterId: decodeURIComponent(parts[2] || "") };
  }
  return { name: "home" };
}

let currentRoute = { name: "home" };

/** Vẽ lại view tương ứng với hash hiện tại. */
async function render() {
  const route = parseRoute();
  currentRoute = route;
  detachReader();
  document.body.removeAttribute("data-rt");
  document.body.classList.toggle("focus-mode", route.name === "reader" && !!settings.focus);
  $$("#bottomNav button").forEach((b) => {
    const map = { home: "home", library: "library", favorites: "favorites", history: "history", admin: "admin" };
    b.setAttribute("aria-current", String(map[route.name] === b.dataset.key));
  });

  try {
    switch (route.name) {
      case "home": await renderHome(); break;
      case "library": await renderLibrary(); break;
      case "favorites": await renderFavorites(); break;
      case "history": await renderHistoryView(); break;
      case "detail": await renderDetail(route.storyId); break;
      case "reader": await renderReader(route.storyId, route.chapterId); break;
      case "admin": await renderAdmin(); break;
      default: await renderHome();
    }
  } catch (err) {
    console.error(err);
    view.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px"><strong>Không mở được trang này</strong>Tải lại trang để thử lại. Chi tiết lỗi nằm trong Console của trình duyệt.</div></div>';
  }
  if (route.name !== "reader") window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------------
 * 5. Thành phần hiển thị dùng lại
 * ------------------------------------------------------------------ */
function coverHTML(story, chapterCount) {
  const badge = story.status === "completed"
    ? '<span class="chip">Hoàn thành</span>'
    : '<span class="chip">Đang ra</span>';
  const inner = story.cover
    ? `<img src="${esc(story.cover)}" alt="Bìa truyện ${esc(story.title)}" loading="lazy">`
    : `<div class="cover-fallback">${esc(story.title)}</div>`;
  return `<div class="cover">${inner}${badge}${typeof chapterCount === "number" ? "" : ""}</div>`;
}

function storyCardHTML(story) {
  const genres = (story.genres || []).slice(0, 2).map((g) => esc(g)).join(" · ");
  return `
  <button class="story-card" data-story="${esc(story.id)}">
    ${coverHTML(story)}
    <h3>${esc(story.title)}</h3>
    <div class="meta"><span>${esc(story.author || "Khuyết danh")}</span></div>
    <div class="meta"><span>${story.chapterCount || 0} chương</span>${genres ? `<span>· ${genres}</span>` : ""}</div>
  </button>`;
}

/** Gắn số chương cho mọi truyện (dùng cho card ở trang chủ/kho truyện). */
async function withChapterCounts(list) {
  const counts = await Promise.all(list.map((s) => DB._p(DB.store("chapters").index("storyId").count(s.id))));
  list.forEach((s, i) => { s.chapterCount = counts[i]; });
  return list;
}

function gridHTML(list, emptyMsg) {
  if (!list.length) {
    return `<div class="empty"><strong>Chưa có truyện nào ở đây</strong>${esc(emptyMsg)}</div>`;
  }
  return `<div class="grid">${list.map(storyCardHTML).join("")}</div>`;
}

/* ---------------------------------------------------------------------
 * 6. Trang chủ & Kho truyện
 * ------------------------------------------------------------------ */
const filterState = { q: "", genre: "", status: "", sort: "updated" };

function applyFilters(list) {
  const q = slugify(filterState.q);
  let out = list.filter((s) => {
    if (filterState.status && s.status !== filterState.status) return false;
    if (filterState.genre && !(s.genres || []).includes(filterState.genre)) return false;
    if (q) {
      const hay = slugify(s.title + " " + (s.author || "") + " " + (s.genres || []).join(" "));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (filterState.sort === "title") out.sort((a, b) => a.title.localeCompare(b.title, "vi"));
  else if (filterState.sort === "chapters") out.sort((a, b) => (b.chapterCount || 0) - (a.chapterCount || 0));
  else out.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return out;
}

function allGenres() {
  const set = new Set();
  stories.forEach((s) => (s.genres || []).forEach((g) => set.add(g)));
  return Array.from(set).sort((a, b) => a.localeCompare(b, "vi"));
}

function filtersHTML() {
  const genres = allGenres();
  return `
  <div class="filters">
    <select class="input" id="fGenre" style="width:auto" aria-label="Lọc theo thể loại">
      <option value="">Mọi thể loại</option>
      ${genres.map((g) => `<option value="${esc(g)}"${filterState.genre === g ? " selected" : ""}>${esc(g)}</option>`).join("")}
    </select>
    <select class="input" id="fStatus" style="width:auto" aria-label="Lọc theo trạng thái">
      <option value="">Mọi trạng thái</option>
      <option value="ongoing"${filterState.status === "ongoing" ? " selected" : ""}>Đang ra</option>
      <option value="completed"${filterState.status === "completed" ? " selected" : ""}>Hoàn thành</option>
    </select>
    <select class="input" id="fSort" style="width:auto" aria-label="Sắp xếp">
      <option value="updated"${filterState.sort === "updated" ? " selected" : ""}>Mới cập nhật</option>
      <option value="title"${filterState.sort === "title" ? " selected" : ""}>Tên A → Z</option>
      <option value="chapters"${filterState.sort === "chapters" ? " selected" : ""}>Nhiều chương nhất</option>
    </select>
    ${filterState.q ? `<button class="btn btn-sm" id="clearQ">Bỏ từ khóa “${esc(filterState.q)}”</button>` : ""}
  </div>`;
}

function bindFilters() {
  const g = $("#fGenre"), s = $("#fStatus"), so = $("#fSort"), c = $("#clearQ");
  if (g) g.onchange = () => { filterState.genre = g.value; refreshGrid(); };
  if (s) s.onchange = () => { filterState.status = s.value; refreshGrid(); };
  if (so) so.onchange = () => { filterState.sort = so.value; refreshGrid(); };
  if (c) c.onclick = () => { filterState.q = ""; $("#globalSearch").value = ""; render(); };
}

/** Vẽ lại riêng lưới truyện, giữ nguyên ô tìm kiếm đang gõ. */
function refreshGrid() {
  const box = $("#storyGrid");

  box.innerHTML = gridHTML(list, "Thử bỏ bớt bộ lọc, hoặc thêm truyện mới trong khu vực Quản trị.");

  if (count) count.textContent = list.length + " truyện";
}

const detailState = { page: 1, perPage: 60, q: "" };

async function renderDetail(storyId) {
  if (!stories.length) await refreshStories();
  let story = storyById(storyId);
  if (!story) { story = await DB.get("stories", storyId); if (story) stories.push(story); }
  if (!story) {
    view.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px"><strong>Không tìm thấy truyện</strong>Truyện có thể đã bị xóa. Quay lại kho truyện để chọn truyện khác.</div></div>';
    return;
  }
  const chapters = await getChapters(storyId);
  detailState.page = 1; detailState.q = "";
  const fav = favorites.includes(story.id);
  const hist = historyOf(story.id);
  const first = chapters[0], last = chapters[chapters.length - 1];

  view.innerHTML = `
  <div class="wrap">
    <button class="btn btn-ghost btn-sm" data-nav="#/library" style="margin-top:16px">
      <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg> Kho truyện
    </button>
    <div class="detail">
      <div>${coverHTML(story)}</div>
      <div>
        <h1>${esc(story.title)}</h1>
        <p class="byline">${esc(story.author || "Khuyết danh")} · cập nhật ${esc(fmtRelative(story.updatedAt || story.createdAt))}</p>
        <div class="tag-row">
          <span class="chip ${story.status === "completed" ? "chip-completed" : "chip-ongoing"}">${story.status === "completed" ? "Hoàn thành" : "Đang ra"}</span>
          <span class="chip">${chapters.length} chương</span>
          ${(story.genres || []).map((g) => `<span class="chip">${esc(g)}</span>`).join("")}
        </div>
        <div class="desc collapsed" id="desc">${esc(story.description || "Truyện này chưa có mô tả.").replace(/\n/g, "<br>")}</div>
        <button class="btn btn-ghost btn-sm" id="descToggle" style="padding-left:0">Xem thêm</button>

        <div class="detail-actions">
          ${first ? `<button class="btn btn-primary" data-nav="#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(first.id)}">Đọc từ đầu</button>` : ""}
          ${last && chapters.length > 1 ? `<button class="btn" data-nav="#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(last.id)}">Đọc chương mới nhất</button>` : ""}
          ${hist ? `<button class="btn" data-nav="#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(hist.chapterId)}">Đọc tiếp chương ${hist.order}</button>` : ""}
          <button class="btn ${fav ? "btn-primary" : ""}" id="favBtn" data-fav="${esc(story.id)}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 4.65-7 9-7 9Z"></path></svg>
            ${fav ? "Đang theo dõi" : "Thêm vào yêu thích"}
          </button>
        </div>
      </div>
    </div>

    <div class="section-head"><h2>Danh sách chương</h2><span class="muted" style="font-size:13px" id="chapCount">${chapters.length} chương</span></div>
    <div class="chapter-tools">
      <input class="input" id="chapSearch" style="max-width:280px" type="search" placeholder="Tìm chương theo tên hoặc số" autocomplete="off">
      <button class="btn btn-sm" id="chapOrder" data-dir="asc">Thứ tự: cũ → mới</button>
    </div>
    <div class="card" style="padding:4px 8px"><div class="chapter-list" id="chapterList"></div></div>
    <div id="chapPager"></div>
    <footer class="site-footer">Mẹo: bật chế độ đọc tập trung trong trang đọc để ẩn mọi thanh công cụ.</footer>
  </div>`;

  // Nút xem thêm / thu gọn mô tả
  const desc = $("#desc"), toggle = $("#descToggle");
  toggle.onclick = () => {
    const collapsed = desc.classList.toggle("collapsed");
    toggle.textContent = collapsed ? "Xem thêm" : "Thu gọn";
  };

  let dir = "asc";
  const drawChapters = () => {
    const q = slugify(detailState.q);
    let list = chapters.filter((c) => !q || slugify("chương " + c.order + " " + c.title).includes(q));
    if (dir === "desc") list = list.slice().reverse();
    const pages = Math.max(1, Math.ceil(list.length / detailState.perPage));
    if (detailState.page > pages) detailState.page = pages;
    const start = (detailState.page - 1) * detailState.perPage;
    const page = list.slice(start, start + detailState.perPage);
    const readId = hist ? hist.chapterId : null;

    $("#chapterList").innerHTML = page.length ? page.map((c) => `
      <button class="chapter-row" data-nav="#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(c.id)}">
        <span class="num">Ch. ${c.order}</span>
        <span class="t">${esc(c.title || "Không tên")}</span>
        ${c.id === readId ? '<span class="read-dot" title="Đang đọc dở"></span>' : ""}
      </button>`).join("") : '<div class="empty" style="border:0">Không có chương nào khớp từ khóa.</div>';

    $("#chapCount").textContent = list.length + " chương";
    $("#chapPager").innerHTML = pages > 1 ? `
      <div class="pager">
        <button class="btn btn-sm" data-page="${detailState.page - 1}" ${detailState.page === 1 ? "disabled" : ""}>Trước</button>
        <span class="muted">Trang ${detailState.page}/${pages}</span>
        <button class="btn btn-sm" data-page="${detailState.page + 1}" ${detailState.page === pages ? "disabled" : ""}>Sau</button>
      </div>` : "";

    $$("#chapPager [data-page]").forEach((b) => {
      b.onclick = () => { detailState.page = Number(b.dataset.page); drawChapters(); };
    });
  };

  $("#chapSearch").addEventListener("input", debounce((e) => {
    detailState.q = e.target.value; detailState.page = 1; drawChapters();
  }, 180));
  $("#chapOrder").onclick = (e) => {
    dir = dir === "asc" ? "desc" : "asc";
    e.currentTarget.textContent = dir === "asc" ? "Thứ tự: cũ → mới" : "Thứ tự: mới → cũ";
    detailState.page = 1; drawChapters();
  };
  drawChapters();
}

/* ---------------------------------------------------------------------
 * 8. Trang đọc truyện
 * ------------------------------------------------------------------ */
const readerState = { story: null, chapters: [], index: -1, onScroll: null, onDocClick: null, restored: false };

function detachReader() {
  if (readerState.onScroll) {
    window.removeEventListener("scroll", readerState.onScroll);
    readerState.onScroll = null;
  }
  if (readerState.onDocClick) {
    document.removeEventListener("click", readerState.onDocClick);
    readerState.onDocClick = null;
  }
  readerState.story = null;
  readerState.chapters = [];
  readerState.index = -1;
}

/** Chuyển văn bản thô thành các thẻ <p>, giữ khoảng cách đoạn. */
function paragraphsHTML(text) {
  const parts = String(text || "").split(/\n\s*\n|\n/).map((s) => s.trim()).filter(Boolean);
  if (!parts.length) return "<p>Chương này chưa có nội dung.</p>";
  return parts.map((p) => `<p>${esc(p)}</p>`).join("");
}

async function renderReader(storyId, chapterId) {
  if (!stories.length) await refreshStories();
  let story = storyById(storyId) || await DB.get("stories", storyId);
  if (!story) {
    view.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px"><strong>Không tìm thấy truyện</strong>Quay lại kho truyện để chọn truyện khác.</div></div>';
    return;
  }
  const chapters = await getChapters(storyId);
  if (!chapters.length) {
    view.innerHTML = `<div class="wrap"><div class="empty" style="margin-top:40px"><strong>Truyện chưa có chương nào</strong>Thêm chương trong khu vực Quản trị, hoặc nhập nhanh bằng file .txt.</div></div>`;
    return;
  }
  let index = chapters.findIndex((c) => c.id === chapterId);
  if (index < 0) index = 0;
  const chapter = chapters[index];

  readerState.story = story;
  readerState.chapters = chapters;
  readerState.index = index;
  readerState.restored = false;

  document.body.dataset.rt = settings.readerTheme;
  document.body.classList.toggle("focus-mode", !!settings.focus);

  view.innerHTML = `
  <div class="reader-toolbar">
    <div class="toolbar-inner" style="position:relative">
      <button class="btn btn-ghost btn-icon" data-nav="#/story/${encodeURIComponent(story.id)}" title="Về trang truyện" aria-label="Về trang truyện">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg>
      </button>
      <select id="chapPick" aria-label="Chọn chương">
        ${chapters.map((c, i) => `<option value="${esc(c.id)}"${i === index ? " selected" : ""}>Ch. ${c.order} — ${esc(c.title || "Không tên")}</option>`).join("")}
      </select>
      <button class="btn btn-ghost btn-icon" id="prevBtn" title="Chương trước" aria-label="Chương trước" ${index === 0 ? "disabled" : ""}>
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="nextBtn" title="Chương sau" aria-label="Chương sau" ${index === chapters.length - 1 ? "disabled" : ""}>
        <svg class="icon" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="settingsBtn" title="Tùy chỉnh hiển thị" aria-label="Tùy chỉnh hiển thị" style="margin-left:auto">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </button>
      <div class="settings-pop hidden" id="settingsPop"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  </div>

  <div class="reader-surface" data-rt="${esc(settings.readerTheme)}" id="readerSurface">
    <article class="reader-inner">
      <h1 class="ch-title">Chương ${chapter.order}${chapter.title ? " — " + esc(chapter.title) : ""}</h1>
      <p class="ch-sub">${esc(story.title)} · ${esc(story.author || "Khuyết danh")}</p>
      <div class="reader-body" id="readerBody">${paragraphsHTML(chapter.content)}</div>
      <nav class="reader-nav">
        <button class="btn" id="prevBtn2" ${index === 0 ? "disabled" : ""}>← Chương trước</button>
        <button class="btn btn-primary" id="nextBtn2" ${index === chapters.length - 1 ? "disabled" : ""}>Chương sau →</button>
      </nav>
    </article>
  </div>`;

  const goTo = (i) => {
    if (i < 0 || i >= chapters.length) return;
    go(`#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(chapters[i].id)}`);
  };
  $("#prevBtn").onclick = () => goTo(index - 1);
  $("#nextBtn").onclick = () => goTo(index + 1);
  $("#prevBtn2").onclick = () => goTo(index - 1);
  $("#nextBtn2").onclick = () => goTo(index + 1);
  $("#chapPick").onchange = (e) => go(`#/read/${encodeURIComponent(story.id)}/${encodeURIComponent(e.target.value)}`);

  buildSettingsPanel();

  // Thanh tiến trình + tự lưu vị trí cuộn
  const progress = $("#progress");
  const saveScroll = throttle(() => trackHistory(story, chapter, window.scrollY), 700);
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 100;
    progress.style.width = pct.toFixed(2) + "%";
    if (readerState.restored) saveScroll();
  };
  readerState.onScroll = onScroll;
  window.addEventListener("scroll", onScroll, { passive: true });

  // Khôi phục vị trí cũ nếu quay lại đúng chương đang đọc dở
  const hist = historyOf(story.id);
  const targetScroll = hist && hist.chapterId === chapter.id ? hist.scroll : 0;
  requestAnimationFrame(() => {
    window.scrollTo(0, targetScroll || 0);
    readerState.restored = true;
    onScroll();
    trackHistory(story, chapter, targetScroll || 0);
  });
}

/** Bảng tùy chỉnh cỡ chữ, phông, chiều rộng, nền và chế độ tập trung. */
function buildSettingsPanel() {
  const pop = $("#settingsPop");
  if (!pop) return;
  const seg = (name, opts, current) => opts.map((o) =>
    `<button data-set="${name}" data-value="${o.v}" aria-pressed="${String(current === o.v)}">${o.l}</button>`).join("");

  pop.innerHTML = `
    <h4>Cỡ chữ</h4>
    <div class="seg">
      <button data-font="-">A −</button>
      <button data-font="0" style="flex:0 0 64px" id="fontVal">${settings.fontSize}px</button>
      <button data-font="+">A +</button>
    </div>
    <h4>Phông chữ</h4>
    <div class="seg">${seg("fontFamily", [{ v: "serif", l: "Có chân" }, { v: "sans", l: "Không chân" }], settings.fontFamily)}</div>
    <h4>Chiều rộng khung đọc</h4>
    <div class="seg">${seg("width", [{ v: "narrow", l: "Hẹp" }, { v: "medium", l: "Vừa" }, { v: "full", l: "Rộng" }], settings.width)}</div>
    <h4>Nền trang đọc</h4>
    <div class="seg">${seg("readerTheme", [{ v: "light", l: "Sáng" }, { v: "sepia", l: "Giấy ngà" }, { v: "dark", l: "Tối" }], settings.readerTheme)}</div>
    <h4>Chế độ đọc</h4>
    <div class="seg">
      <button data-focus="1" aria-pressed="${String(!!settings.focus)}">Tập trung ${settings.focus ? "đang bật" : "đang tắt"}</button>
    </div>
    <p class="muted" style="font-size:12px;margin:0">Chế độ tập trung ẩn thanh công cụ; đưa chuột lên mép trên (hoặc nhấn phím Esc) để hiện lại.</p>`;

  const btn = $("#settingsBtn");
  btn.onclick = (e) => { e.stopPropagation(); pop.classList.toggle("hidden"); };
  // Bấm ra ngoài thì đóng bảng; listener được gỡ khi rời trang đọc (detachReader)
  readerState.onDocClick = (e) => {
    if (!pop.isConnected) return;
    if (!pop.classList.contains("hidden") && !pop.contains(e.target) && !btn.contains(e.target)) pop.classList.add("hidden");
  };
  document.addEventListener("click", readerState.onDocClick);

  pop.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.font) {
      if (b.dataset.font === "+") settings.fontSize = Math.min(32, settings.fontSize + 1);
      else if (b.dataset.font === "-") settings.fontSize = Math.max(14, settings.fontSize - 1);
      $("#fontVal").textContent = settings.fontSize + "px";
    } else if (b.dataset.set) {
      settings[b.dataset.set] = b.dataset.value;
      if (b.dataset.set === "readerTheme") {
        document.body.dataset.rt = settings.readerTheme;
        const surf = $("#readerSurface");
        if (surf) surf.dataset.rt = settings.readerTheme;
      }
      $$(`[data-set="${b.dataset.set}"]`, pop).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    } else if (b.dataset.focus) {
      settings.focus = !settings.focus;
      document.body.classList.toggle("focus-mode", settings.focus);
      b.setAttribute("aria-pressed", String(settings.focus));
      b.textContent = "Tập trung " + (settings.focus ? "đang bật" : "đang tắt");
    } else return;
    saveSettings();
    applySettings();
  });
}

/* ---------------------------------------------------------------------
 * 9. Hộp thoại dùng chung
 * ------------------------------------------------------------------ */
function openModal(html, onMount) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const backdrop = $(".modal-backdrop", root);
  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) closeModal(); });
  if (onMount) onMount(root);
  const firstInput = $("input,textarea,select,button", root);
  if (firstInput) firstInput.focus();
  return root;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

function confirmDialog(title, message, confirmLabel = "Xóa") {
  return new Promise((resolve) => {
    openModal(`
      <h3>${esc(title)}</h3>
      <p class="muted" style="margin-top:0">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn" id="cfNo">Hủy</button>
        <button class="btn btn-primary" id="cfYes">${esc(confirmLabel)}</button>
      </div>`, (root) => {
      $("#cfNo", root).onclick = () => { closeModal(); resolve(false); };
      $("#cfYes", root).onclick = () => { closeModal(); resolve(true); };
    });
  });
}

/* ---------------------------------------------------------------------
 * 10. Ảnh bìa: nén về base64 kích thước nhỏ
 * ------------------------------------------------------------------ */
function compressImage(file, maxWidth = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Không đọc được ảnh"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Không đọc được tệp"));
    reader.readAsDataURL(file);
  });
}

/** Thống kê: số truyện, số chương, dung lượng lưu trữ đã dùng. */
async function drawAdminStats() {
  const box = $("#adminStats");
  if (!box) return;
  const totalChapters = await DB._p(DB.store("chapters").count());
  let usage = "—", quota = "";
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      usage = fmtBytes(est.usage || 0);
      if (est.quota) quota = "trên " + fmtBytes(est.quota);
    } catch (err) { console.warn("Không lấy được dung lượng:", err); }
  }
  box.innerHTML = `
    <div class="stat-card"><b>${stories.length}</b><span>truyện trong kho</span></div>

async function panelChapters() {
  const panel = $("#adminPanel");
  if (!stories.length) {

  }
  if (!adminStoryId || !storyById(adminStoryId)) adminStoryId = stories[0].id;

  panel.innerHTML = `

      <button class="btn btn-primary btn-sm" id="addChapter">Thêm chương</button>

    </div>

      <table class="table"><thead><tr>
        <th style="width:70px">Số</th><th>Tên chương</th><th style="width:110px">Độ dài</th><th style="width:220px">Thao tác</th>
      </tr></thead><tbody id="chapRows"></tbody></table>
    </div>`;

  const drawRows = async () => {
    const list = await getChapters(adminStoryId, true);
    $("#chapRows").innerHTML = list.length ? list.map((c, i) => `
      <tr>
        <td>${c.order}</td>
        <td>${esc(c.title || "Không tên")}</td>
        <td class="muted">${(c.content || "").length.toLocaleString("vi-VN")} ký tự</td>
        <td><div class="row-actions">
          <button class="btn btn-sm" data-up="${esc(c.id)}" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn btn-sm" data-down="${esc(c.id)}" ${i === list.length - 1 ? "disabled" : ""}>↓</button>
          <button class="btn btn-sm" data-edit="${esc(c.id)}">Sửa</button>
          <button class="btn btn-sm btn-danger" data-del="${esc(c.id)}">Xóa</button>
        </div></td>
      </tr>`).join("") : '<tr><td colspan="4" class="muted" style="padding:22px 10px">Truyện này chưa có chương. Bấm “Thêm chương” hoặc dùng thẻ nhập file .txt.</td></tr>';

    $$("#chapRows [data-edit]").forEach((b) => b.onclick = async () => {
      const c = (await getChapters(adminStoryId)).find((x) => x.id === b.dataset.edit);
      chapterForm(adminStoryId, c, drawRows);
    });
    $$("#chapRows [data-del]").forEach((b) => b.onclick = async () => {
      const ok = await confirmDialog("Xóa chương này?", "Nội dung chương sẽ bị xóa khỏi IndexedDB.");
      if (!ok) return;
      await DB.del("chapters", b.dataset.del);
      invalidate(adminStoryId);
      await touchStory(adminStoryId);
      await drawRows(); drawAdminStats();
      toast("Đã xóa chương");
    });

    // Đổi chỗ hai chương liền kề bằng cách hoán đổi số thứ tự
    const swap = async (id, dir) => {
      const arr = await getChapters(adminStoryId);
      const i = arr.findIndex((x) => x.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= arr.length) return;
      const a = arr[i], b2 = arr[j];
      const tmp = a.order; a.order = b2.order; b2.order = tmp;
      await DB.bulkPut("chapters", [a, b2]);
      invalidate(adminStoryId);
      await drawRows();
    };
    $$("#chapRows [data-up]").forEach((b) => b.onclick = () => swap(b.dataset.up, -1));
    $$("#chapRows [data-down]").forEach((b) => b.onclick = () => swap(b.dataset.down, 1));
  };

  $("#chStory").onchange = (e) => { adminStoryId = e.target.value; panelChapters(); };
  $("#addChapter").onclick = async () => {
    const list = await getChapters(adminStoryId);
    const nextOrder = list.length ? Math.max(...list.map((c) => c.order)) + 1 : 1;
    chapterForm(adminStoryId, { id: uid("ch"), storyId: adminStoryId, order: nextOrder, title: "", content: "" }, drawRows, true);
  };
  $("#renumber").onclick = async () => {
    const list = await getChapters(adminStoryId, true);
    list.forEach((c, i) => { c.order = i + 1; });
    await DB.bulkPut("chapters", list);
    invalidate(adminStoryId);
    await drawRows();
    toast("Đã đánh số lại các chương");
  };

  await drawRows();
}
